name: Release

# Triggered by pushing a tag like "Nuke/12.8.0" or manually via workflow_dispatch.
# Tag-based runs build, test, pack, and publish to NuGet.
# Manual dispatch supports dry-run mode (build + pack without publish).

# Per-run title in the Actions UI. Tag-push events resolve `github.ref_name` to
# the tag (e.g. `MatterSupport/26.2.3`); workflow_dispatch uses `inputs.tag`.
# Without this, the Actions list shows every run as "Release" — unusable when
# kicking off many libraries at once.
#
# Release-wave gotcha: pushing >3 tags in a single `git push origin ...` call
# silently skips workflow_dispatch for the surplus tags (GHA throttle on tag-
# push event delivery; no error, no warning). For a multi-package wave, use
# `workflow_dispatch` instead:
#   for t in Lib1/1.2.3 Lib2/4.5.6 ...; do
#     gh workflow run release.yml -f tag="$t" -f dry_run=false
#   done
# Single tag pushes still trigger reliably — the throttle only hits bulk pushes.
run-name: >-
  Release ${{ inputs.tag || github.ref_name }}${{ inputs.dry_run == true && ' (dry run)' || '' }}

on:
  push:
    tags:
      - '*/[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Library/version to release (e.g., Nuke/12.8.0)'
        required: true
        type: string
      dry_run:
        description: 'Dry run — build and pack without publishing'
        type: boolean
        default: true

# For workflow_dispatch, github.ref_name is the branch (`main`) — not the tag
# we're publishing. Without `inputs.tag` taking precedence here, every
# workflow_dispatch run collapses to group `release-main` and GHA's queue
# semantics cancel pending runs when newer ones arrive (cancel-in-progress
# only protects the in-progress slot, not pending). For tag-push events
# `inputs.tag` is empty and ref_name is the tag (e.g. `WeatherKit/26.2.0`),
# so the fallback handles that case correctly.
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ── Job 1: Parse the tag ──────────────────────────────────────────────────────
  parse:
    runs-on: ubuntu-latest
    outputs:
      library: ${{ steps.parse.outputs.library }}
      version: ${{ steps.parse.outputs.version }}
      dry_run: ${{ steps.parse.outputs.dry_run }}
      pairings: ${{ steps.pairings.outputs.pairings }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: toolchains

      # One pack/consume job per pairing, on the runner image toolchains/<pairing>.json names
      # (Xcode 27 is only on the xcode-27 image).
      - name: Read the pairings
        id: pairings
        run: |
          echo "pairings=$(jq -cs '{include: [.[] | {pairing: .pairing, runner: .ciRunner}]}' \
            toolchains/net10-xcode26.json toolchains/net10-xcode27.json toolchains/net11-xcode27.json)" >> "$GITHUB_OUTPUT"

      - name: Parse and validate tag
        id: parse
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
            DRY_RUN="${{ github.event.inputs.dry_run }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            DRY_RUN="false"
          fi

          # Strict semver validation (mirrors release.yml:50 in pre-Session-4)
          if ! echo "$TAG" | grep -qE '^[A-Za-z0-9._-]+/[0-9]+\.[0-9]+\.[0-9]+([-+].*)?$'; then
            echo "::error::Invalid tag format: $TAG (expected <Library>/<semver>, e.g. Nuke/12.8.0)"
            exit 1
          fi

          LIBRARY="${TAG%%/[0-9]*}"
          VERSION="${TAG#*/}"

          # All three outputs MUST be emitted in this single step — the
          # publish job's `if: needs.parse.outputs.dry_run != 'true'` gate
          # depends on dry_run being a real step output, not a literal.
          echo "library=$LIBRARY" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dry_run=$DRY_RUN" >> "$GITHUB_OUTPUT"

          {
            echo "## Release"
            echo "- **Library:** $LIBRARY"
            echo "- **Version:** $VERSION"
            echo "- **Dry run:** $DRY_RUN"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Job 2: Pack one copy per .NET + Xcode pairing ──────────────────────────────
  # Every package ships ONE nupkg carrying one copy per pairing (net10.0-<plat>26.0,
  # net10.0-<plat>27.2, net11.0-<plat>27.2). Each pairing packs its own copy here (a
  # "contribution", never published on its own) and runs its own simulator test;
  # the merge job folds the contributions together.
  pack:
    needs: parse
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.parse.outputs.pairings) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up ${{ matrix.pairing }}
        uses: ./.github/actions/setup-pairing
        with:
          pairing: ${{ matrix.pairing }}

      # Cache must come BEFORE `dotnet tool restore` so the restored
      # ~/.nuget/packages already contains nuke.globaltool on cache-hit
      # runs. One cache per pairing: the pairings restore the same package
      # ids and versions with different contents.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ matrix.pairing }}-${{ hashFiles('**/*.csproj', '.config/dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-${{ matrix.pairing }}-

      - name: Restore Nuke tool
        run: dotnet tool restore

      - name: Build and pack this pairing's copy
        id: pack
        run: |
          dotnet nuke BuildAndPackRelease \
            --library "${{ needs.parse.outputs.library }}" \
            --version "${{ needs.parse.outputs.version }}" \
            --output "${{ runner.temp }}/contribution" \
            ${{ needs.parse.outputs.dry_run == 'true' && '--dry-run' || '' }}

      # Validates the code through <ProjectReference> on this pairing's simulator
      # runtime and engine (Mono on .NET 10, the CoreCLR interpreter on .NET 11).
      - name: Build and validate on iOS Simulator
        # 40 min total gives Nuke's --step-timeout 1800 (30 min) headroom for
        # cleanup, diagnostics collection, and binlog upload.
        timeout-minutes: 40
        run: |
          # --timeout is the RUN budget (from the app's first line); --launch-timeout is
          # the separate budget for reaching that first line (install/boot/dyld).
          dotnet nuke RunCiSimTest \
            --library "${{ needs.parse.outputs.library }}" \
            --timeout 60 \
            --launch-timeout 120 \
            --step-timeout 1800 \
            --reuse-sim

      - name: Upload simulator diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sim-diagnostics-${{ needs.parse.outputs.library }}-${{ needs.parse.outputs.version }}-${{ matrix.pairing }}
          path: /tmp/sim-diagnostics/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload this pairing's contribution
        if: ${{ always() && steps.pack.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: contribution-${{ needs.parse.outputs.library }}-${{ needs.parse.outputs.version }}-${{ matrix.pairing }}
          path: ${{ runner.temp }}/contribution/
          retention-days: 7

  # ── Job 3: Merge the contributions into the one package that ships ────────────
  # SwiftBindingsMergePackages refuses copies whose public API or compiled-in values
  # disagree. A refusal fails the release; it is a finding, never something to bypass.
  merge:
    needs: [parse, pack]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Set up net10-xcode26
        uses: ./.github/actions/setup-pairing
        with:
          pairing: net10-xcode26

      - name: Restore Nuke tool
        run: dotnet tool restore

      - name: Download contributions
        uses: actions/download-artifact@v4
        with:
          pattern: contribution-${{ needs.parse.outputs.library }}-${{ needs.parse.outputs.version }}-*
          path: ${{ runner.temp }}/artifacts/

      - name: Lay out contributions per pairing
        run: |
          for p in net10-xcode26 net10-xcode27 net11-xcode27; do
            src="${{ runner.temp }}/artifacts/contribution-${{ needs.parse.outputs.library }}-${{ needs.parse.outputs.version }}-$p"
            [ -d "$src" ] || { echo "::error::no contribution from $p"; exit 1; }
            mkdir -p "${{ runner.temp }}/merge/contributions/$p"
            cp "$src"/*.nupkg "${{ runner.temp }}/merge/contributions/$p/"
          done

      - name: Merge
        run: |
          dotnet nuke MergePackages \
            --library "${{ needs.parse.outputs.library }}" \
            --version "${{ needs.parse.outputs.version }}" \
            --contributions "${{ runner.temp }}/merge/contributions" \
            --output "${{ runner.temp }}/merge"
          # The release manifest travels with the merged packages.
          cp "${{ runner.temp }}/artifacts/contribution-${{ needs.parse.outputs.library }}-${{ needs.parse.outputs.version }}-net10-xcode26/release-manifest.json" \
             "${{ runner.temp }}/merge/merged/" 2>/dev/null || true

      - name: Summarize merged packages
        run: |
          {
            echo ""
            echo "### Merged packages"
            for pkg in "${{ runner.temp }}/merge/merged"/*.nupkg; do
              [ -f "$pkg" ] || continue
              echo "- \`$(basename "$pkg")\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload merged packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages-${{ needs.parse.outputs.library }}-${{ needs.parse.outputs.version }}
          path: ${{ runner.temp }}/merge/merged/
          retention-days: 30

  # ── Job 4: Consume the merged package on every pairing ─────────────────────────
  # Restores the EXACT merged packages into the test app (PackageReference mode, an
  # isolated package cache, a feed holding only the merged packages plus nuget.org),
  # runs it on the simulator and asserts the assemblies that loaded came from them.
  # On each pairing the consumer must select that pairing's copy.
  consume:
    needs: [parse, merge]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.parse.outputs.pairings) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up ${{ matrix.pairing }}
        uses: ./.github/actions/setup-pairing
        with:
          pairing: ${{ matrix.pairing }}

      - name: Restore Nuke tool
        run: dotnet tool restore

      - name: Download merged packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages-${{ needs.parse.outputs.library }}-${{ needs.parse.outputs.version }}
          path: ${{ runner.temp }}/packages/

      - name: Consume the merged packages from the staged feed
        timeout-minutes: 40
        run: |
          dotnet nuke ReleaseConsume \
            --library "${{ needs.parse.outputs.library }}" \
            --version "${{ needs.parse.outputs.version }}" \
            --consume-feed "${{ runner.temp }}/packages" \
            --timeout 60 \
            --launch-timeout 120 \
            --step-timeout 1800

      - name: Upload simulator diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: consume-diagnostics-${{ needs.parse.outputs.library }}-${{ needs.parse.outputs.version }}-${{ matrix.pairing }}
          path: /tmp/sim-diagnostics/
          retention-days: 7
          if-no-files-found: ignore

  # ── Job 5: Publish the merged packages to NuGet ──────────────────────────────────────────────────
  # Runs on ubuntu-latest in the `nuget-publish` environment so the
  # NUGET_API_KEY secret is never exposed to the macOS build job and an
  # approval gate can be enforced before publishing.
  publish:
    needs: [parse, consume]
    if: needs.parse.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    environment: nuget-publish
    steps:
      - uses: actions/checkout@v4

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages-${{ needs.parse.outputs.library }}-${{ needs.parse.outputs.version }}
          path: packages/

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          dotnet-quality: preview

      # Push .nupkg files directly via `dotnet nuget push`. We deliberately
      # avoid `dotnet nuke PublishRelease` here: invoking nuke would trigger
      # MSBuild evaluation of build/_build.csproj, which (because global.json
      # pins workloadVersion) requires the iOS/macOS/MacCatalyst workload
      # manifests to be installed — wasted work on a Linux runner that only
      # needs to push prebuilt artifacts. Mirrors the PublishRelease target
      # logic: parallel push, --skip-duplicate, deterministic ordering.
      - name: Publish to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          # Suppress the dotnet first-run experience. Without these, every
          # `dotnet` invocation runs DotnetFirstTimeUseConfigurer on startup,
          # which is the machinery that races below (see the pre-warm note).
          DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
          DOTNET_NOLOGO: "1"
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
        run: |
          set -e
          shopt -s nullglob
          pkgs=(packages/*.nupkg)
          if [ ${#pkgs[@]} -eq 0 ]; then
            echo "::error::No .nupkg files found in packages/"
            exit 1
          fi
          echo "=== Publishing ${#pkgs[@]} package(s) (parallelism=5) ==="
          printf '  - %s\n' "${pkgs[@]}"
          # Pre-warm the dotnet first-run config ONCE, serially, before the
          # parallel push. On a cold runner the first `dotnet` invocation runs
          # NuGet.Common.Migrations.MigrationRunner, which creates the named
          # mutex `NuGet-Migrations` backed by a file under /tmp/.dotnet/shm.
          # When `xargs -P5` starts 5 `dotnet` processes simultaneously, one is
          # still creating that directory tree while another stat()s it ->
          # ENOENT -> IOException -> that process dies before pushing -> xargs
          # exits 123 and the whole step fails (with most packages already
          # pushed). Only multi-package libraries (e.g. Stripe's 14 .nupkg)
          # ever fan out wide enough to trip it. One serial warm-up populates
          # the shm dir so the parallel pushes never race. (Belt-and-suspenders
          # with DOTNET_SKIP_FIRST_TIME_EXPERIENCE above.)
          dotnet nuget locals all --list >/dev/null 2>&1 || true
          # NUL-delimit so any filename quirks are safe end-to-end; xargs -P5
          # runs up to 5 pushes in parallel.
          printf '%s\0' "${pkgs[@]}" | LC_ALL=C sort -z | xargs -0 -P5 -I{} \
            dotnet nuget push "{}" \
              --source "https://api.nuget.org/v3/index.json" \
              --api-key "$NUGET_API_KEY" \
              --skip-duplicate

          {
            echo ""
            echo "### Published to NuGet"
            echo "- **Library:** ${{ needs.parse.outputs.library }}"
            echo "- **Version:** ${{ needs.parse.outputs.version }}"
            for pkg in packages/*.nupkg; do
              [ -f "$pkg" ] || continue
              echo "- \`$(basename "$pkg")\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"
