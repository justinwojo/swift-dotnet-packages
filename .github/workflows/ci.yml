name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Detect which libraries need building ───────────────────────────────────
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      paired: ${{ steps.detect.outputs.paired }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # required for diff-based ListChangedLibraries

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          dotnet-quality: preview

      # Cache must come BEFORE `dotnet tool restore` so the restored
      # ~/.nuget/packages already contains nuke.globaltool on cache-hit
      # runs — otherwise tool restore re-downloads the tool every time
      # and only the post-restore steps benefit from the cache.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '.config/dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore Nuke tool
        run: dotnet tool restore

      - name: Detect changed libraries
        id: detect
        run: |
          # Nuke writes its banner, target table, and "Build succeeded" line
          # to stdout, so `tail -n 1` would capture the success banner — not
          # the JSON. Grep for the matrix line by its leading `{"include":`
          # marker instead. ListChangedLibraries always emits exactly one
          # matrix line; if the regex matches zero or more than one we want
          # to fail loudly rather than silently set MATRIX to garbage.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MATRIX=$(dotnet nuke ListChangedLibraries --all --json \
              | grep -E '^\{"include":' | tail -n 1)
          else
            MATRIX=$(dotnet nuke ListChangedLibraries \
              --base-sha "${{ github.event.pull_request.base.sha }}" \
              --head-sha "${{ github.sha }}" \
              --json \
              | grep -E '^\{"include":' | tail -n 1)
          fi

          if [ -z "$MATRIX" ]; then
            echo "::error::ListChangedLibraries did not emit a matrix line — see preceding output"
            exit 1
          fi

          echo "Matrix: $MATRIX"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          # Every library builds, packs and sim-tests once per .NET + Xcode pairing.
          # The pairings and the runner image each needs come from toolchains/<pairing>.json
          # (Xcode 27 is only on the xcode-27 image).
          PAIRED=$(jq -cs --argjson m "$MATRIX" '{include: [$m.include[] as $l
            | .[] | $l + {pairing: .pairing, runner: .ciRunner}]}' toolchains/net10-xcode26.json \
            toolchains/net10-xcode27.json toolchains/net11-xcode27.json)
          echo "paired=$PAIRED" >> "$GITHUB_OUTPUT"

          # has_changes=false when the include[] array is empty
          if echo "$MATRIX" | grep -q '"include":\[\]'; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

  # ── Third-party library: build, test, and validate packaging ────────────────
  build:
    needs: detect
    if: needs.detect.outputs.has_changes == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.paired) }}
    name: build (${{ matrix.library }}, ${{ matrix.pairing }})
    steps:
      - if: matrix.kind != 'third-party'
        run: echo "Skipping — not a third-party library" && exit 0

      - uses: actions/checkout@v4
        if: matrix.kind == 'third-party'

      # The pairing selects the Xcode, the exact .NET SDK and the workload set
      # (toolchains/<pairing>.json) and exports SwiftBindingsPairing, which
      # Directory.Build.props turns into the labelled target frameworks.
      - name: Set up ${{ matrix.pairing }}
        if: matrix.kind == 'third-party'
        uses: ./.github/actions/setup-pairing
        with:
          pairing: ${{ matrix.pairing }}

      - name: Cache NuGet packages
        if: matrix.kind == 'third-party'
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ matrix.pairing }}-${{ hashFiles('**/*.csproj', '.config/dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-${{ matrix.pairing }}-

      - name: Restore Nuke tool
        if: matrix.kind == 'third-party'
        run: dotnet tool restore

      - name: Build library (xcframeworks + dependency injection + dotnet build)
        if: matrix.kind == 'third-party'
        run: dotnet nuke BuildLibrary --library "${{ matrix.library }}" --all-products

      - name: Validate packaging
        if: matrix.kind == 'third-party'
        run: dotnet nuke PackValidate --library "${{ matrix.library }}" --output "${{ runner.temp }}/ci-packages"

      - name: Upload this pairing's contribution
        if: matrix.kind == 'third-party'
        uses: actions/upload-artifact@v4
        with:
          name: ci-contribution-${{ matrix.library }}-${{ matrix.pairing }}
          path: ${{ runner.temp }}/ci-packages/*.nupkg
          retention-days: 3

      - name: Build and validate on iOS Simulator
        if: matrix.kind == 'third-party'
        # 40 min total gives Nuke's --step-timeout 1800 (30 min) headroom for
        # cleanup, diagnostics collection, and binlog upload. The step budget
        # has to cover install + launch + the library's run budget in one attempt.
        timeout-minutes: 40
        run: |
          # --timeout is the RUN budget: how long the suite may take to reach a
          # marker, measured from the app's FIRST line. A library whose test app
          # awaits more than this raises it from the harness's own per-library
          # table, so this is a floor for the rest, not a cap for them.
          # --launch-timeout is the separate budget for reaching that first line
          # (install/boot/dyld); a hung launch is called there instead of eating
          # the run budget.
          dotnet nuke RunCiSimTest \
            --library "${{ matrix.library }}" \
            --timeout 60 \
            --launch-timeout 120 \
            --step-timeout 1800 \
            --reuse-sim

      - name: Upload simulator diagnostics
        if: failure() && matrix.kind == 'third-party'
        uses: actions/upload-artifact@v4
        with:
          name: sim-diagnostics-${{ matrix.library }}-${{ matrix.pairing }}
          path: /tmp/sim-diagnostics/
          retention-days: 7
          if-no-files-found: ignore

  # ── Apple framework: build, pack-validate, and sim test ───��────────────────
  apple-framework:
    needs: detect
    if: needs.detect.outputs.has_changes == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.paired) }}
    name: apple-framework (${{ matrix.library }}, ${{ matrix.pairing }})
    steps:
      - if: matrix.kind != 'apple-framework'
        run: echo "Skipping — not an Apple framework" && exit 0

      - uses: actions/checkout@v4
        if: matrix.kind == 'apple-framework'

      - name: Set up ${{ matrix.pairing }}
        if: matrix.kind == 'apple-framework'
        uses: ./.github/actions/setup-pairing
        with:
          pairing: ${{ matrix.pairing }}

      - name: Cache NuGet packages
        if: matrix.kind == 'apple-framework'
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ matrix.pairing }}-${{ hashFiles('**/*.csproj', '.config/dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-${{ matrix.pairing }}-

      - name: Restore Nuke tool
        if: matrix.kind == 'apple-framework'
        run: dotnet tool restore

      - name: Build Apple framework
        if: matrix.kind == 'apple-framework'
        run: dotnet nuke BuildAppleFramework --library "${{ matrix.library }}"

      - name: Validate packaging
        if: matrix.kind == 'apple-framework'
        run: dotnet nuke PackValidateAppleFramework --library "${{ matrix.library }}" --output "${{ runner.temp }}/ci-packages"

      - name: Upload this pairing's contribution
        if: matrix.kind == 'apple-framework'
        uses: actions/upload-artifact@v4
        with:
          name: ci-contribution-${{ matrix.library }}-${{ matrix.pairing }}
          path: ${{ runner.temp }}/ci-packages/*.nupkg
          retention-days: 3

      - name: Check for co-located test project
        if: matrix.kind == 'apple-framework'
        id: has_tests
        run: |
          # All tests are co-located: apple-frameworks/<Name>/tests/ for Apple
          # frameworks, libraries/<Name>/tests/ for third-party libraries.
          if [ -d "apple-frameworks/${{ matrix.library }}/tests" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No co-located test project for ${{ matrix.library }} — skipping sim validation"
          fi

      - name: Build and validate on iOS Simulator
        if: matrix.kind == 'apple-framework' && steps.has_tests.outputs.exists == 'true'
        # 40 min total gives Nuke's --step-timeout 1800 (30 min) headroom for
        # cleanup, diagnostics collection, and binlog upload. The step budget
        # has to cover install + launch + the library's run budget in one attempt.
        timeout-minutes: 40
        run: |
          # --timeout is the RUN budget: how long the suite may take to reach a
          # marker, measured from the app's FIRST line. A library whose test app
          # awaits more than this raises it from the harness's own per-library
          # table, so this is a floor for the rest, not a cap for them.
          # --launch-timeout is the separate budget for reaching that first line
          # (install/boot/dyld); a hung launch is called there instead of eating
          # the run budget.
          dotnet nuke RunCiSimTest \
            --library "${{ matrix.library }}" \
            --timeout 60 \
            --launch-timeout 120 \
            --step-timeout 1800 \
            --reuse-sim

      - name: Upload simulator diagnostics
        if: failure() && matrix.kind == 'apple-framework' && steps.has_tests.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sim-diagnostics-${{ matrix.library }}-${{ matrix.pairing }}
          path: /tmp/sim-diagnostics/
          retention-days: 7
          if-no-files-found: ignore

  # ── Merge: every package must fold its per-pairing copies into one ───────────
  # The release ships only the merged package, so CI proves the merge on every
  # changed library: SwiftBindingsMergePackages refuses copies whose public API
  # or compiled-in values disagree, and a refusal fails the PR.
  merge:
    needs: [detect, build, apple-framework]
    if: needs.detect.outputs.has_changes == 'true'
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up net10-xcode26
        uses: ./.github/actions/setup-pairing
        with:
          pairing: net10-xcode26

      - name: Restore Nuke tool
        run: dotnet tool restore

      - name: Download contributions
        uses: actions/download-artifact@v4
        with:
          pattern: ci-contribution-${{ matrix.library }}-*
          path: ${{ runner.temp }}/artifacts/

      - name: Merge the pairings' copies
        run: |
          for p in net10-xcode26 net10-xcode27 net11-xcode27; do
            src="${{ runner.temp }}/artifacts/ci-contribution-${{ matrix.library }}-$p"
            [ -d "$src" ] || { echo "::error::no contribution from $p"; exit 1; }
            mkdir -p "${{ runner.temp }}/merge/contributions/$p"
            cp "$src"/*.nupkg "${{ runner.temp }}/merge/contributions/$p/"
          done
          dotnet nuke MergePackages \
            --library "${{ matrix.library }}" \
            --version 0.0.0-ci \
            --contributions "${{ runner.temp }}/merge/contributions" \
            --output "${{ runner.temp }}/merge"
